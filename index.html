<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0907" />
    <title>S19 DM Screen — The Tower in the Stone</title>
    <meta name="description" content="DM session runner for Wanderings In Middle Earth — Session 19." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Leaflet CSS for the World map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />

    <style>
      /* Customize Leaflet popups to match the DM cockpit theme */
      .leaflet-container {
        background: #0a0907 !important;
      }
      .leaflet-popup-content-wrapper {
        background: #15110b !important;
        color: #f0e6d0 !important;
        border: 1px solid #5a4a26 !important;
        border-radius: 4px !important;
        padding: 4px !important;
      }
      .leaflet-popup-tip {
        background: #15110b !important;
        border: 1px solid #5a4a26 !important;
      }
      .leaflet-popup-close-button {
        color: #a89878 !important;
      }
      .leaflet-control-zoom a {
        background: #15110b !important;
        color: #d4a847 !important;
        border: 1px solid #3a2e18 !important;
      }
      .leaflet-control-zoom a:hover {
        background: #1f180e !important;
      }
      .world-marker {
        background: transparent !important;
        border: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Leaflet JS, loaded before the app so window.L is ready -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
